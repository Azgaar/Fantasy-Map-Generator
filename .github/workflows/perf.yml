name: Performance Benchmarks
on:
  pull_request:
    branches: [master]

  workflow_dispatch:

# No write permissions here on purpose: this workflow runs the (untrusted) PR's own code, so fork
# PRs would only get GITHUB_TOKEN read access anyway. Posting the PR comment happens in
# perf-comment.yml, which runs in the base repo's trusted context.
permissions:
  contents: read

jobs:
  perf:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Alternates base (master) and head (this PR) on the same runner across several rounds and
      # compares median per-metric ratios, so a busy neighbour on the shared runner cancels out
      # instead of needing a threshold wide enough to hide it. Measures real map generation
      # (fixed seeds) and a scripted zoom/pan gesture over a real fixture map, not synthetic data.
      - name: Run A/B perf benchmarks against master
        id: perf
        continue-on-error: true
        run: npm run perf:ab -- --base origin/master --head HEAD --rounds 3 --threshold 0.25 --markdown-out perf-report/comment.md

      - name: Save PR number
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p perf-report
          echo "${{ github.event.pull_request.number }}" > perf-report/pr-number.txt

      - name: Upload benchmark comment artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: perf-comment
          path: |
            perf-report/comment.md
            perf-report/pr-number.txt
          if-no-files-found: ignore

      - name: Fail job on performance regression
        if: steps.perf.outcome == 'failure'
        run: exit 1
