name: Nix package

on:
  # Run on every PR so nix-build can be required without skipped-check deadlocks.
  pull_request:
    branches: [master]

  push:
    branches: [master]

  workflow_dispatch:

jobs:
  nix-build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check the flake evaluates
        run: nix flake check --no-build --all-systems
      - name: Build the desktop package
        run: nix build .#fantasy-map-generator -L
      - name: Check the built app is complete
        run: |
          set -euo pipefail
          test -x result/bin/fantasy-map-generator
          for file in main.js preload.js icon.png renderer/index.html; do
            test -f "result/share/fantasy-map-generator/dist-electron/$file"
          done
          # Dependency installation must restore the original manifest before packaging.
          cmp package.json result/share/fantasy-map-generator/package.json
          version=$(jq -r .version result/share/fantasy-map-generator/package.json)
          echo "built fantasy-map-generator $version"
