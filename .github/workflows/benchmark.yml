name: Benchmark
on:
  pull_request:
    branches: [master]
    # the app's own code; see docs/architecture/benchmark.md
    paths:
      - "src/**"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # the report comment

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  benchmark:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Compare against the commit the change branched from
        shell: bash # with pipefail, so a broken run still fails through tee
        run: node scripts/benchmark.mjs --base origin/${{ github.base_ref || 'master' }} | tee benchmark.md
      - name: Comment the report on the pull request
        # a fork's token is read-only, so its report stays in the job summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          [ -s benchmark.md ] || exit 0
          body=$(printf '<!-- benchmark -->\n%s' "$(cat benchmark.md)")
          id=$(gh api "$COMMENTS" --paginate --jq '.[] | select(.body | startswith("<!-- benchmark -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body" > /dev/null
          else gh api "$COMMENTS" -f body="$body" > /dev/null; fi
