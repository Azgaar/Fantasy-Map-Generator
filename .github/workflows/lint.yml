name: Lint

on:
  pull_request:

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@v2 # no version: it installs the one package-lock.json pins
      - name: Run Biome
        run: biome ci .
