name: Lint

on:
  pull_request:

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          # match the repo's devDependency: a floating "latest" starts enforcing rules the
          # local toolchain doesn't have yet, failing PRs on files they never touched
          version: 2.5.12
      - name: Run Biome
        run: biome ci .
